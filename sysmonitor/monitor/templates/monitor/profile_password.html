<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SysMonitor — Change Password</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0f172a; --surface:#1e293b; --border:#334155; --text:#f1f5f9;
      --muted:#94a3b8; --blue:#3b82f6; --red:#ef4444;
    }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; }
    nav { background:var(--surface); border-bottom:1px solid var(--border); padding:.6rem 2rem; display:flex; align-items:center; justify-content:space-between; }
    .brand { font-size:1rem; font-weight:700; }
    .brand span { color:var(--blue); }
    .nav-meta a { color:var(--muted); font-size:.78rem; text-decoration:none; padding:.3rem .65rem; border-radius:6px; }
    .nav-meta a:hover { background:var(--border); color:var(--text); }

    .main { max-width:420px; margin:0 auto; padding:1.5rem; }
    .page-title { font-size:1.3rem; font-weight:700; margin-bottom:1.5rem; }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.5rem; }
    .form-group { display:flex; flex-direction:column; gap:.4rem; margin-bottom:1rem; }
    label { font-size:.78rem; color:var(--muted); font-weight:500; }
    input { background:#0f172a; border:1px solid var(--border); border-radius:8px; color:var(--text); padding:.6rem .85rem; font-size:.88rem; width:100%; }
    input:focus { outline:none; border-color:var(--blue); }

    .btn { padding:.65rem 1.2rem; border-radius:8px; border:none; cursor:pointer; font-size:.85rem; font-weight:500; width:100%; }
    .btn-primary { background:var(--blue); color:white; }
    .btn-primary:hover { background:#2563eb; }

    .toast { position:fixed; bottom:1.5rem; right:1.5rem; padding:.75rem 1.25rem; border-radius:10px; font-size:.85rem; font-weight:500; z-index:9999; max-width:320px; }
    .toast-ok { background:#14532d; color:#4ade80; border:1px solid #16a34a; }
    .toast-err { background:#450a0a; color:#fca5a5; border:1px solid #dc2626; }
  </style>
</head>
<body>

<nav>
  <div class="brand">Sys<span>Monitor</span></div>
  <div class="nav-meta">
    <a href="{% url 'profile_view' %}">← Back to Profile</a>
    <a href="{% url 'logout' %}">Logout</a>
  </div>
</nav>

<div class="main">
  <div class="page-title">🔒 Change Password</div>

  <div class="card">
    <form id="pw-form">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="old_password" required>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password1" required>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="new_password2" required>
      </div>
      <button type="submit" class="btn btn-primary">🔒 Update Password</button>
    </form>
  </div>
</div>

<script>
function toast(msg, ok=true) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

document.getElementById('pw-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const body = new URLSearchParams();
  for (const [k, v] of formData) body.append(k, v);

  fetch('{% url "profile_password_save" %}', {
    method: 'POST',
    headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString(),
  }).then(r => r.json()).then(r => {
    if (r.ok) {
      toast('✅ Password changed successfully!');
      setTimeout(() => window.location.href = '{% url "profile_view" %}', 1500);
    } else {
      toast('❌ ' + r.error, false);
    }
  }).catch(() => toast('❌ Network error', false));
});
</script>


<!-- FOOTER -->
{% include "monitor/footer.html" %}

</body>
</html>
