# REMOTE server. Do NOT create a new server{} block: app.bsccl.com already has one.
# Copy this file to /etc/nginx/snippets/sysmonitor-locations.conf and add ONE line
#     include /etc/nginx/snippets/sysmonitor-locations.conf;
# inside the existing HTTPS (443) server block of app.bsccl.com.
# "^~" makes these win over any regex location (e.g. a static-files rule) in that block.
# No URI after proxy_pass: nginx must pass the full /sysmonitor/... path;
# SCRIPT_NAME tells Django it lives under /sysmonitor.
location ^~ /sysmonitor/ {
    proxy_pass http://127.0.0.1:8020;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header SCRIPT_NAME /sysmonitor;
    proxy_read_timeout 60s;
    client_max_body_size 25m;
}
location = /sysmonitor { return 301 /sysmonitor/; }
# (profile pictures and static files are served by SysMonitor itself — nothing else needed.)
