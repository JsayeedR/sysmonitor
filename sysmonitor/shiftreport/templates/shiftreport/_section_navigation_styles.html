
<style id="sm-shared-section-style">
.sm-section-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 20px;
    padding: 9px;
    background: #172338;
    border: 1px solid #334155;
    border-radius: 11px;
}

.sm-section-tab {
    display: inline-flex;
    flex: 1 1 190px;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 9px 12px;
    background: #26364d;
    border: 1px solid #475569;
    border-radius: 8px;
    color: #e2e8f0;
    font: 600 13px "Segoe UI", Arial, sans-serif;
    text-align: center;
    text-decoration: none;
    transition: background .15s;
}

.sm-section-tab:hover {
    background: #344a68;
    color: #fff;
}

.sm-section-tab.active {
    background: #2563eb;
    border-color: #60a5fa;
    color: #fff;
}

.sm-section-tab:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
}

@media (max-width: 650px) {
    .sm-section-tab {
        flex: 1 1 100%;
        justify-content: flex-start;
    }
}

/* Historical Report interface only */

body.sm-historical {
    margin: 0;
    padding: 0;
    background: #0f172a;
    color: #f1f5f9;
    font-family: "Segoe UI", Arial, sans-serif;
}

.sm-historical .container {
    max-width: 1250px;
    padding: 1.4rem 1rem 3rem;
    margin: auto;
}

.sm-historical .panel {
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid #334155;
    border-radius: 12px;
    box-shadow: none;
}

.sm-historical h1,
.sm-historical h2,
.sm-historical h3 {
    color: #f8fafc;
}

.sm-historical p {
    color: #cbd5e1;
}

.sm-historical th {
    background: #26364d;
    color: #bfdbfe;
}

.sm-historical th.heading {
    background: #1d4ed8;
    color: white;
}

.sm-historical td {
    color: #e2e8f0;
    border-color: #475569;
}

.sm-historical textarea {
    background: #0f172a;
    color: #f1f5f9;
    border-color: #475569;
}

.sm-historical textarea:focus {
    outline: 2px solid #60a5fa;
}

.sm-historical a:not(.sm-section-tab) {
    color: #93c5fd;
}

.sm-historical button {
    background: #2563eb;
    color: white;
    border-radius: 7px;
}

.sm-historical button:hover {
    background: #1d4ed8;
}

/* sm-report-paper-a321: unified compact section UI */
.sm-section-tabs{max-width:1250px;margin:0 auto 18px;padding:6px;gap:6px;border-radius:10px}
.sm-section-tab{flex:1 1 0;min-width:0;min-height:39px;padding:8px 9px;font-size:12.5px;border-radius:7px;white-space:normal}
.sm-section-tab.active{background:#2563eb;border-color:#60a5fa}
.wrap{max-width:1250px!important}
body.sm-historical .container{max-width:1250px!important;padding:1.1rem 1rem 3rem}
body.sm-historical .sm-section-tabs{margin:0 auto 18px}
body.sm-historical .container>h1{font-size:1.45rem;margin:8px 0 12px}
body.sm-historical .panel{padding:17px;margin-top:14px}
.sm-paper{background:#fff;color:#172033;border:1px solid #d1d5db;border-radius:9px;padding:22px;margin:14px 0 18px;box-shadow:0 5px 17px #0002;font-family:Calibri,Arial,sans-serif;font-size:14px;line-height:1.5}
.sm-paper p,.sm-paper .sm-paper-signature{color:#172033!important}
.sm-paper .sm-paper-subject{font-weight:700;border-bottom:1px solid #d1d5db;padding-bottom:9px;margin-bottom:16px}
.sm-paper-scroll{max-width:100%;overflow-x:auto}
.sm-paper-table{width:100%;border-collapse:collapse;table-layout:auto;font-family:Calibri,Arial,sans-serif;font-size:13px}
.sm-paper-table th,.sm-paper-table td{border:1px solid #555!important;color:#111827!important;background:#fff!important;padding:8px;text-align:center;vertical-align:middle}
.sm-paper-table th{background:#f6dfd3!important;color:#111827!important;font-weight:700}
.sm-paper-table input,.sm-paper-table select,.sm-paper-table textarea{display:block;box-sizing:border-box;width:100%;min-width:100px;max-width:100%;padding:7px 5px;background:#fff!important;color:#111827!important;border:1px solid #94a3b8;border-radius:4px;font-size:13px;font-family:inherit}
.sm-paper-table input[readonly]{background:#f1f5f9!important;border-color:transparent}
.sm-paper-signature{margin-top:20px;line-height:1.5}
.sm-paper-signature .sm-signature-name{font-weight:bold;color:#bb6627}
.sm-paper-action{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap}
.sm-sheet .sm-paper-table th{background:#c6d9f1!important;text-align:left}
.sm-sheet .sm-paper-table th.heading{background:#c6d9f1!important;color:#111827!important;text-align:center;font-size:16px}
.sm-sheet .sm-paper-table td{text-align:left;vertical-align:top}
.sm-sheet .sm-paper-table textarea{min-width:135px;min-height:80px;resize:vertical;white-space:pre-wrap}
.sm-sheet .sm-paper-table td button{background:#334155!important;color:#fff!important;min-width:0}
.sm-sheet .sm-paper-table .sm-sheet-action{width:80px}
.sm-paper-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sm-paper-toolbar button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
@media(max-width:900px){.sm-section-tab{flex:1 1 42%}}
@media(max-width:600px){.sm-section-tab{flex:1 1 100%}.sm-paper{padding:12px}}


/* A5_COMPACT_UI_20261009: main navbar first; compact second-row section tabs */
nav.sm-section-tabs {
  position: relative !important;
  top: auto !important;
  z-index: 1 !important;
  display: grid !important;
  grid-template-columns: repeat(4,minmax(0,1fr));
  align-items: stretch !important;
  justify-content: stretch !important;
  width: 100%; max-width: 1180px;
  margin: 8px auto 12px !important;
  padding: 5px !important;
  gap: 5px !important;
  border: 1px solid #334155 !important;
  border-radius: 10px !important;
  background: #172338 !important;
  box-sizing: border-box;
}
nav.sm-section-tabs > a.sm-section-tab {
  display: flex !important;
  flex: initial !important;
  width: auto !important;
  min-width: 0 !important;
  min-height: 34px !important;
  padding: 6px 7px !important;
  font-size: 11.5px !important;
  line-height: 1.25 !important;
  font-weight: 600 !important;
  white-space: normal !important;
  text-align: center !important;
  border-radius: 7px !important;
}
/* Three visible buttons should share the second row evenly. */
nav.sm-section-tabs:has(> a:nth-child(3):last-child) {
  grid-template-columns: repeat(3,minmax(0,1fr));
}
/* Compact title + status + warning, visually one header card. */
.sm-a5-overview {
  max-width: 1180px;
  margin: 0 auto 12px;
  padding: 12px 15px;
  background: #18283d;
  border: 1px solid #39516f;
  border-radius: 11px;
  box-shadow: 0 3px 12px rgba(0,0,0,.10);
}
.sm-a5-overview > .heading {margin:0 0 5px !important;padding:0 !important;border:0 !important;background:transparent !important;}
.sm-a5-overview h1, .sm-a5-overview h2,
body.sm-historical .sm-a5-overview h1,
body.sm-historical .sm-a5-overview h2 {
  margin: 0 0 5px !important;
  padding: 0 !important;
  font-size: 17px !important;
  line-height: 1.3 !important;
  font-weight: 700 !important;
}
.sm-a5-overview .muted,
.sm-a5-overview > p {font-size:12px !important;line-height:1.45 !important;margin:3px 0 7px !important;}
.sm-a5-overview .panel {margin:7px 0 0 !important;padding:10px 12px !important;border-radius:8px !important;}
.sm-a5-overview .panel > h2 {font-size:14px !important;}
.sm-a5-overview .msg, .sm-a5-overview .alert,
.sm-a5-overview .warning {margin:7px 0 !important;padding:8px 11px !important;border:1px solid #eab308 !important;border-left:4px solid #f59e0b !important;border-radius:8px !important;background:#422f16 !important;color:#fef3c7 !important;font-size:12.5px !important;line-height:1.45 !important;}
.sm-a5-overview .panel > strong {font-size:12.5px !important;}
.sm-a5-overview .btn {font-size:12px !important;padding:6px 10px !important;}
/* Notices outside header cards also appear as compact distinct notifications. */
body .wrap > .msg, body .container > .msg {border:1px solid #eab308 !important;border-left:4px solid #f59e0b !important;border-radius:8px !important;padding:9px 12px !important;font-size:12px !important;}
body.sm-historical .container {padding-top:0.7rem !important;}
body.sm-historical .sm-a5-overview {margin:0 0 11px !important;}
body.sm-historical .sm-a5-overview .panel {border:0 !important;background:transparent !important;padding:0 !important;box-shadow:none !important;}
body.sm-historical .sm-a5-overview .status {font-size:12px !important;}
@media(max-width:760px) {
  nav.sm-section-tabs, nav.sm-section-tabs:has(> a:nth-child(3):last-child) {grid-template-columns:repeat(2,minmax(0,1fr));}
  nav.sm-section-tabs > a.sm-section-tab {min-height:37px !important;font-size:11px !important;}
  .sm-a5-overview {padding:10px 12px;}
}


body.sm-historical .sm-a5-revision-panel {padding:11px 13px !important;margin:0 0 12px !important;border-radius:10px !important;}
body.sm-historical .sm-a5-revision-panel > h2 {font-size:15px !important;margin:0 0 3px !important;}
body.sm-historical .sm-a5-revision-panel > p {font-size:12px !important;margin:0 0 7px !important;}
</style>
